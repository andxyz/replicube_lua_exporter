#:schema https://mise.en.dev/schema/mise-task.json

[tasks.build]
description = "Build the golang CLI"
run = "go build -trimpath -ldflags='-s -w'"

[tasks.test]
description = "Test the golang CLI"
alias = 't'
run = [ "mise tasks run test:export", "mise tasks run test:compare_dirs" ]

[tasks."test:export"]
description = "Test the export"
depends = [ ":build", ":clean_tests_golang" ]
run = "./replicube_lua_exporter -f ../test/large_progress.dat -o ../test/solutions_golang"

[tasks."test:compare_dirs"]
description = "Test using compare"
run = "diff --recursive -y --suppress-common-lines --exclude='puzzles.json' ../test/solutions_golang ../test/solutions_rust"

[tasks."clean_tests_golang"]
description = "Clean golang test dir"
run = "rm -rf ./test/solutions_golang"

[tasks."dump_mysavegame"]
description = "dumps the contents of my savegame"
run = "./replicube_lua_exporter -f ../test/large_progress.dat -o ~/code/personal/replicube_solutions/"
