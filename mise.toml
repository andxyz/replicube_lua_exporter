#:schema https://mise.en.dev/schema/mise.json
min_version = "2026.7.7"
# experimental_monorepo_root=true
monorepo_root = true

[env]
HK_MISE = 1

[monorepo]
config_roots = [
  "replicube_lua_exporter_golang",
  "replicube_lua_exporter_rust",
]

[tools]
go = "latest"
rust = "latest"
sops = "latest"
# hk [tools_hk]
hk = "latest"
pkl = "latest"
# more hk things [tools_hkthings]
actionlint = "latest"
jq = "latest"
fd = "latest"
lua-language-server = "latest"
stylua = "latest"
"npm:markdownlint-cli" = "latest"
prettier = "3.9.5"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = "hk install --mise"

[settings]
lockfile = true

[task_config]
includes = [ "tasks.toml", "xtasks" ]
